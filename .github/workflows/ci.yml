name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Build, e2e and LLVM coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
          cache: false

      - name: Set up Clang, LLVM and host musl
        run: bash dev/ci_setup.sh

      - name: Check the toolchain
        run: |
          command -v clang clang++ wasm-ld llvm-ar llvm-ranlib llvm-profdata llvm-cov
          clang --version
          go version
          echo "Build and coverage workers: $BUILD_JOBS"

      - name: Build the native and embedded compilers and VM
        run: |
          set -o pipefail
          ./build -j "$BUILD_JOBS" aot_native aot_command vm aot_native_chaos vm_chaos 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Run e2e tests with LLVM and Go coverage
        run: |
          set -o pipefail
          ./build -j "$BUILD_JOBS" coverage 2>&1 | tee "$RUNNER_TEMP/coverage.log"

      - name: Check the 99 percent floor
        run: ./build coverage_check

      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('.build/coverage/summary.txt') != '' }}
        run: |
          {
            echo '## Coverage'
            echo
            echo '```text'
            cat .build/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native AOT coverage to Codecov
        if: ${{ !cancelled() && hashFiles('.build/coverage/aot-native.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: .build/coverage/aot-native.info
          flags: aot-native
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Wasm AOT coverage to Codecov
        if: ${{ !cancelled() && hashFiles('.build/coverage/aot-wasm.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: .build/coverage/aot-wasm.info
          flags: aot-wasm
          disable_search: true
          fail_ci_if_error: true

      - name: Upload VM coverage to Codecov
        if: ${{ !cancelled() && hashFiles('.build/coverage/vm-codecov.out') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: .build/coverage/vm-codecov.out
          flags: vm
          disable_search: true
          fail_ci_if_error: true

      - name: Save coverage reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            .build/coverage/*.info
            .build/coverage/*.lcov
            .build/coverage/*.out
            .build/coverage/*.json
            .build/coverage/*.txt
            .build/coverage/*.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/coverage.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
