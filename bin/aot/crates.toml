# Every crate aot is built from, and how. A crate with `sha256` is fetched
# from crates.io as a .crate archive and is never edited; a crate with `path`
# lives in this repository (aot itself, and any third-party crate we patch,
# kept whole under bin/aot/crates/); a crate with `rust-src` is a directory of
# the Rust library sources of rustc's own release. The graph compiles each
# crate with rustc directly: `features` is the full feature set the crate is
# built with, `deps` and `build-deps` name the crates of this table it links
# against. Versions follow wasmtime v50.0.0's Cargo.lock, the release
# cranelift 0.137.0 ships in.
#
# Everything below aot-cli is no_std: the same crates build for the host and
# for wasm32-unknown-unknown, where the library is core, compiler_builtins
# and alloc compiled from source (`sysroot`) and there is no std at all.

[aot-cli]
path = "bin/aot/cli"
deps = ["aot"]

[aot-wasm]
path = "bin/aot/wasm"
deps = ["aot"]

[aot]
path = "bin/aot"
deps = ["cranelift-codegen", "cranelift-frontend", "wasmparser"]

[core]
rust-src = "core"
sysroot = true

[compiler_builtins]
rust-src = "compiler-builtins/compiler-builtins"
sysroot = true
features = ["compiler-builtins"]
deps = ["core"]

[alloc]
rust-src = "alloc"
sysroot = true
deps = ["compiler_builtins", "core"]

[wasmparser]
version = "0.261.0"
sha256 = "4f20f20e44f7e8aeb6744823ea9d869ede51e51be4fdaedede2852282e54d2d8"
features = ["features", "validate"]
deps = ["bitflags"]

[bitflags]
version = "2.11.1"
sha256 = "c4512299f36f043ab09a583e57bceb5a5aab7a73db1805848e8fef3c9e8c78b3"

[cranelift-frontend]
version = "0.137.0"
sha256 = "b929f09b82a270e2aae062945cf86cd9db39c59ad9bead6986ea6b09fcf8a969"
deps = ["cranelift-codegen", "hashbrown", "log", "smallvec", "target-lexicon"]

# x86 is the only backend for now; arm64 is one more feature here.
[cranelift-codegen]
version = "0.137.0"
sha256 = "a53dbec33ff86909e44be6f0ec2d17841aa38b931013707c9fc7279f1f0e5760"
features = ["x86"]
deps = [
    "bumpalo",
    "cranelift-assembler-x64",
    "cranelift-bforest",
    "cranelift-bitset",
    "cranelift-codegen-shared",
    "cranelift-control",
    "cranelift-entity",
    "hashbrown",
    "libm",
    "log",
    "regalloc2",
    "rustc-hash",
    "smallvec",
    "target-lexicon",
    "wasmtime-internal-core",
]
build-deps = ["cranelift-codegen-meta", "cranelift-isle"]

[cranelift-codegen-meta]
