[package]
name = "aot"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
cranelift-codegen = { version = "=0.137.0", default-features = false, features = ["x86"] }
cranelift-frontend = { version = "=0.137.0", default-features = false }
wasmparser = { version = "=0.261.0", default-features = false, features = ["features", "validate"] }
